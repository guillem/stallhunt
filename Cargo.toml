[package]
name = "bottleneck-finder"
version = "0.1.0"
edition = "2024"
description = "Linux-first command-line performance triage"
publish = false

[[bin]]
name = "bottleneck"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
