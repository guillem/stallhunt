[package]
name = "stallhunt"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Linux-first command-line performance triage"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/guillem/stallhunt"
homepage = "https://github.com/guillem/stallhunt"
keywords = ["linux", "procfs", "psi", "performance", "triage"]
categories = ["command-line-utilities", "development-tools::profiling"]
publish = false

[[bin]]
name = "stallhunt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["param", "net", "time"] }
netlink-sys = { version = "0.9", default-features = false }
ctrlc = "3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.28"
unicode-width = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
