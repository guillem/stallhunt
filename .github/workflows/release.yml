name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package Linux tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="stallhunt-${VERSION}-x86_64-unknown-linux-gnu"
          STAGING="dist/${PACKAGE}"
          mkdir -p "${STAGING}"
          cp target/release/stallhunt README.md LICENSE-MIT LICENSE-APACHE docs/stallhunt.1 "${STAGING}/"
          tar -C dist -czf "dist/${PACKAGE}.tar.gz" "${PACKAGE}"
          (
            cd dist
            sha256sum "${PACKAGE}.tar.gz" > "${PACKAGE}.tar.gz.sha256"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: stallhunt-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
